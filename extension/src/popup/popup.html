<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Perceive</title>
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1a1a1a;
      color: #eaeaea;
    }
    h1 { font-size: 15px; margin: 0 0 8px 0; }
    p { font-size: 12px; color: #aaa; margin: 0 0 12px 0; line-height: 1.4; }
    textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 60px;
      background: #262626;
      color: #eaeaea;
      border: 1px solid #3a3a3a;
      border-radius: 4px;
      padding: 8px;
      font-size: 12px;
      margin-bottom: 8px;
      resize: vertical;
    }
    button {
      width: 100%;
      padding: 8px;
      background: #28a745;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover { background: #218838; }
    #dashboard-btn { background: #2a2d33; margin-top: 6px; font-size: 11px; padding: 6px; }
    #dashboard-btn:hover { background: #34373d; }
    .status {
      font-size: 11px;
      padding: 6px 8px;
      background: #262626;
      border-radius: 4px;
      color: #7fd77f;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <h1>Perceive</h1>
  <p>Privacy-preserving on-device redaction for AI browser agents.</p>
  <textarea id="task-input" placeholder="e.g. Log in with username 'tomsmith' and password 'SuperSecretPassword!'"></textarea>
  <button id="run-btn">Run Task</button>
  <button id="dashboard-btn">Open audit dashboard</button>
  <div class="status" id="status">● Extension active</div>
  <script src="popup.js"></script>
</body>
</html>
