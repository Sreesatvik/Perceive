<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Perceive — Audit Dashboard</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #14161a;
    color: #eaeaea;
    margin: 0;
    padding: 20px;
  }
  h1 { font-size: 18px; margin: 0 0 4px 0; }
  .subtitle { font-size: 12px; color: #999; margin: 0 0 16px 0; }
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 20px; }
  button {
    background: #2a2d33; color: #eaeaea; border: 1px solid #3a3d43;
    border-radius: 6px; padding: 8px 14px; font-size: 13px; cursor: pointer;
  }
  button:hover { background: #34373d; }
  button.danger { background: #4a1f1f; border-color: #6a2a2a; }
  button.danger:hover { background: #5a2626; }
  #empty-state { color: #777; font-size: 13px; padding: 40px 0; text-align: center; }
  .step-card {
    background: #1c1f24; border: 1px solid #2c2f35; border-radius: 8px;
    padding: 16px; margin-bottom: 16px;
  }
  .step-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px; font-size: 13px; color: #aaa;
  }
  .step-header .step-num { color: #eaeaea; font-weight: 600; font-size: 14px; }
  .risk-badge {
    display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600;
  }
  .risk-safe { background: #1e3a24; color: #7fd77f; }
  .risk-risky { background: #4a1f1f; color: #f08a8a; }
  .images-row { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .image-col { flex: 1; min-width: 200px; }
  .image-col .label { font-size: 11px; color: #888; margin-bottom: 4px; }
  .image-col img { width: 100%; border: 1px solid #2c2f35; border-radius: 4px; background: #000; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 10px; table-layout: fixed; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid #26292f; word-break: break-word; }
  td:last-child, th:last-child { width: 130px; }
  th { color: #888; font-weight: 500; }
  .source-badge {
    display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 10px;
  }
  .source-dom_heuristic { background: #1e2f3a; color: #7fbfd7; }
  .source-vision_model { background: #3a2f1e; color: #d7a87f; }
  .source-ocr_regex { background: #2f1e3a; color: #b57fd7; }
  .action-line { font-size: 12px; color: #ccc; margin-bottom: 10px; }
  .action-line code { background: #26292f; padding: 2px 5px; border-radius: 3px; }
  .metrics-row { display: flex; gap: 8px; flex-wrap: wrap; font-size: 11px; }
  .metric-chip { background: #26292f; padding: 3px 8px; border-radius: 4px; color: #aaa; }
  .metric-chip b { color: #eaeaea; }
  .status-row { display: flex; gap: 8px; flex-wrap: wrap; font-size: 11px; margin-bottom: 10px; }
  .status-chip { padding: 3px 8px; border-radius: 4px; }
  .status-chip.ok { background: #1e3a24; color: #7fd77f; }
  .status-chip.warn { background: #4a3a1f; color: #f0c98a; }
  .status-chip.bad { background: #4a1f1f; color: #f08a8a; }
  .status-chip.exec-unknown { background: #2a2d33; color: #999; }
  .payload-toggle { font-size: 11px; color: #7fa8d7; cursor: pointer; margin-top: 6px; display: inline-block; }
  pre.payload {
    display: none; background: #0e1013; padding: 10px; border-radius: 4px;
    font-size: 11px; overflow-x: auto; max-height: 240px; margin-top: 6px;
  }
</style>
</head>
<body>
  <h1>Perceive — audit dashboard</h1>
  <p class="subtitle">Live, per-step proof of what was detected, why, and what actually crossed the wire.</p>

  <div class="toolbar">
    <button id="clear-btn">Clear</button>
    <button id="redteam-btn">Open red-team demo page</button>
    <button id="audit-log-btn">Open audit log chain viewer</button>
    <button id="before-after-btn">Open before/after screenshot viewer</button>
  </div>

  <div id="empty-state">No steps recorded yet. Run a task from the popup, or open the red-team demo page above and run a task against it.</div>
  <div id="steps-container"></div>

  <script src="auditDashboard.js"></script>
</body>
</html>
