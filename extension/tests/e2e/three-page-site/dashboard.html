<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Perceive Demo — Dashboard</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f4f5f7; margin: 0; padding: 32px; }
  .card { background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 400px; }
  h1 { font-size: 18px; margin: 0 0 16px 0; }
  nav a { display: inline-block; margin-top: 20px; color: #2563eb; text-decoration: none; font-size: 14px; }
  nav a:hover { text-decoration: underline; }
  canvas { border: 1px solid #e2e2e2; border-radius: 4px; background: #fafafa; }
</style>
</head>
<body>
  <div class="card">
    <h1>Account Dashboard</h1>
    <p style="font-size:12px;color:#777;margin:0 0 12px 0;">
      Balance is rendered as CANVAS PIXELS below — deliberately zero DOM-visible
      text or attribute anywhere on this page carries the number, so the only
      way to read it is the vision/OCR channel, not the DOM.
    </p>
    <canvas id="balance-canvas" width="260" height="70"></canvas>
    <nav><a href="profile.html">Go to Profile &rarr;</a></nav>
  </div>
  <script>
    // The one and only place "4,281.50" exists anywhere in this page's
    // reachable state is inside this canvas's rendered pixels — never in
    // the DOM (no title attribute, no aria-label, no hidden span, nothing).
    const ctx = document.getElementById('balance-canvas').getContext('2d');
    ctx.fillStyle = '#111';
    ctx.font = '20px sans-serif';
    ctx.fillText('Balance: $4,281.50', 16, 40);
  </script>
</body>
</html>
