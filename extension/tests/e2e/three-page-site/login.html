<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Perceive Demo — Login</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f4f5f7; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
  form { background: #fff; padding: 32px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); width: 280px; }
  h1 { font-size: 18px; margin: 0 0 20px 0; }
  label { display: block; font-size: 13px; color: #555; margin-bottom: 4px; margin-top: 14px; }
  input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
  button { margin-top: 20px; width: 100%; padding: 10px; background: #2563eb; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
  button:hover { background: #1d4ed8; }
  #error { color: #c0392b; font-size: 12px; margin-top: 10px; display: none; }
</style>
</head>
<body>
  <form id="login-form">
    <h1>Perceive Demo — Sign in</h1>
    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username" />
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" />
    <button type="submit" id="login-btn">Log in</button>
    <div id="error">Invalid username or password.</div>
  </form>
  <script>
    // Deliberately trivial: any non-empty username/password "succeeds", to
    // keep this a repeatable, deterministic Phase F test fixture rather
    // than a real auth system.
    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value.trim();
      if (u && p) {
        window.location.href = 'dashboard.html';
      } else {
        document.getElementById('error').style.display = 'block';
      }
    });
  </script>
</body>
</html>
