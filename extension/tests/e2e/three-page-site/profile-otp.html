<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Perceive Demo — Profile (OTP-gated)</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f4f5f7; margin: 0; padding: 32px; }
  .card { background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 320px; }
  h1 { font-size: 18px; margin: 0 0 16px 0; }
  label { display: block; font-size: 13px; color: #555; margin-bottom: 4px; margin-top: 14px; }
  input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
  button { margin-top: 20px; width: 100%; padding: 10px; background: #2563eb; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
  button:hover { background: #1d4ed8; }
  #status { font-size: 12px; color: #2e7d32; margin-top: 10px; display: none; }
  #otp-section { display: none; margin-top: 14px; padding-top: 14px; border-top: 1px dashed #ddd; }
</style>
</head>
<body>
  <div class="card">
    <h1>Profile — Update Phone Number</h1>
    <label for="phone">Phone number</label>
    <input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="Phone number" />
    <button type="button" id="update-btn">Update</button>

    <!--
      Step 2: this OTP field does NOT exist in the DOM at page load — it is
      injected/revealed only after "Update" is clicked, simulating a
      real-world OTP requirement appearing mid-flow that the original task
      instruction could not have anticipated. It is present in markup but
      hidden (display:none) rather than injected via JS purely for fixture
      simplicity; either is equivalent from the pipeline's perspective
      since detection runs on the LIVE DOM at capture time, not at load
      time, and a hidden/display:none field is correctly excluded from
      "visible interactive elements" the same way an off-screen one is
      (Phase E.2's viewport filtering) until it is actually shown.
    -->
    <div id="otp-section">
      <label for="otp">Enter the code sent to your phone</label>
      <input id="otp" name="otp" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="6-digit code" />
      <button type="button" id="confirm-otp-btn">Confirm code</button>
    </div>

    <div id="status">Phone number updated.</div>
  </div>
  <script>
    document.getElementById('update-btn').addEventListener('click', () => {
      document.getElementById('otp-section').style.display = 'block';
    });
    document.getElementById('confirm-otp-btn').addEventListener('click', () => {
      const code = document.getElementById('otp').value.trim();
      if (code) {
        document.getElementById('status').style.display = 'block';
      }
    });
  </script>
</body>
</html>
